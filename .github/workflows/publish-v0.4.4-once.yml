name: Publish v0.4.4 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.4.4-once.yml'

permissions:
  contents: write

concurrency:
  group: publish-v0.4.4-once
  cancel-in-progress: false

jobs:
  build:
    name: Build v0.4.4 archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 008d9b47b06302d29d76c961c3f4c6ab86c94988
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '008d9b47b06302d29d76c961c3f4c6ab86c94988'
          grep -Fq 'Version   = "0.4.4"' internal/buildinfo/buildinfo.go
          go test -count=1 -timeout 180s ./...
          go vet ./...
          (cd verification/sdkprobe && go test -count=1 -timeout 120s ./...)
      - name: Build exact release archives
        shell: bash
        run: |
          set -euo pipefail
          version='0.4.4'
          release_sha='008d9b47b06302d29d76c961c3f4c6ab86c94988'
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist stage
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="mcp-manager-${version}-${goos}-${goarch}"
            bin='mcp-manager'
            if [ "$goos" = windows ]; then bin='mcp-manager.exe'; fi
            rm -rf stage/*
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X github.com/online111111/mcp-manager/internal/buildinfo.Version=${version} -X github.com/online111111/mcp-manager/internal/buildinfo.Commit=${release_sha} -X github.com/online111111/mcp-manager/internal/buildinfo.BuildDate=${build_date}" \
              -o "stage/${bin}" ./cmd/mcp-manager
            cp README.md stage/README.md
            if [ "$goos" = windows ]; then
              cp scripts/windows/start-mcp-manager.cmd stage/start-mcp-manager.cmd
              cp scripts/windows/start-mcp-manager.ps1 stage/start-mcp-manager.ps1
              cp scripts/windows/copy-admin-token.cmd stage/copy-admin-token.cmd
              cp scripts/windows/copy-admin-token.ps1 stage/copy-admin-token.ps1
              cp scripts/windows/README-WINDOWS.txt stage/README-WINDOWS.txt
              (cd stage && zip -q "../dist/${name}.zip" "$bin" README.md start-mcp-manager.cmd start-mcp-manager.ps1 copy-admin-token.cmd copy-admin-token.ps1 README-WINDOWS.txt)
            else
              tar -C stage -czf "dist/${name}.tar.gz" "$bin" README.md
            fi
          done
          (cd dist && sha256sum mcp-manager-* > SHA256SUMS)
      - name: Upload exact release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist-v0.4.4
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  verify-windows:
    name: Verify exact v0.4.4 Windows ZIP
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download exact release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist-v0.4.4
          path: dist
      - name: Run final Windows amd64 ZIP with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'dist\mcp-manager-0.4.4-windows-amd64.zip'
          if (-not (Test-Path $zip)) { throw "Missing Windows amd64 archive: $zip" }
          $extract = Join-Path $PWD 'windows-release-smoke'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $extract
          foreach ($required in @('mcp-manager.exe','start-mcp-manager.cmd','start-mcp-manager.ps1','copy-admin-token.cmd','copy-admin-token.ps1','README-WINDOWS.txt')) {
            if (-not (Test-Path (Join-Path $extract $required))) { throw "Release ZIP is missing $required" }
          }
          Push-Location $extract
          try {
            .\mcp-manager.exe version
            if ($LASTEXITCODE -ne 0) { throw 'Version command failed' }
            Remove-Item .\config.json -Force -ErrorAction SilentlyContinue
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\start-mcp-manager.ps1 -NoBrowser -ExitAfterReady
            if ($LASTEXITCODE -ne 0) { throw "Launcher failed with exit code $LASTEXITCODE" }
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'config.json'))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { throw 'config.json contains UTF-8 BOM' }
            $cfg = Get-Content .\config.json -Raw | ConvertFrom-Json
            $expectedToken = [string]$cfg.hub.admin.token
            if ([string]::IsNullOrWhiteSpace($expectedToken)) { throw 'Admin Token missing from config.json' }
            if ((Get-Clipboard -Raw).Trim() -ne $expectedToken) { throw 'First-run clipboard token mismatch' }
            Set-Clipboard -Value 'sentinel'
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\copy-admin-token.ps1
            if ($LASTEXITCODE -ne 0) { throw "copy-admin-token helper failed with exit code $LASTEXITCODE" }
            if ((Get-Clipboard -Raw).Trim() -ne $expectedToken) { throw 'Recovery helper clipboard token mismatch' }
            .\mcp-manager.exe validate --config .\config.json
            if ($LASTEXITCODE -ne 0) { throw 'Final packaged config validation failed' }
          } finally {
            Pop-Location
          }

  publish:
    name: Publish v0.4.4 only after Windows verification
    needs: verify-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for tag creation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download verified release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist-v0.4.4
          path: dist
      - name: Verify tag target and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha='008d9b47b06302d29d76c961c3f4c6ab86c94988'
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.4.4 >/dev/null; then
            test "$(git rev-list -n1 v0.4.4)" = "$release_sha"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v0.4.4 "$release_sha" -m 'MCP Manager v0.4.4'
            git push origin refs/tags/v0.4.4
          fi
          gh release create v0.4.4 --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
