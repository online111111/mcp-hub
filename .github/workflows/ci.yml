name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.25.8'
            current: false
          - os: windows-latest
            go: '1.25.8'
            current: false
          - os: macos-latest
            go: '1.25.8'
            current: false
          - os: ubuntu-latest
            go: '1.27.1'
            current: true
          - os: windows-latest
            go: '1.27.1'
            current: true
          - os: macos-latest
            go: '1.27.1'
            current: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Set up Node
        if: runner.os == 'Linux' && matrix.current
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Admin UI unit tests
        if: runner.os == 'Linux' && matrix.current
        run: |
          node --check internal/admin/web/app.js
          node --test internal/admin/webtest/*.test.mjs
      - name: Install browser regression dependencies
        if: runner.os == 'Linux' && matrix.current
        working-directory: internal/admin/browsertest
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Chromium UI regressions
        if: runner.os == 'Linux' && matrix.current
        working-directory: internal/admin/browsertest
        run: npm test
      - name: Test
        run: go test -count=1 -timeout 180s ./...
      - name: Race test
        if: matrix.current
        run: go test -race -count=1 -timeout 240s ./...
      - name: Vet
        run: go vet ./...
      - name: SDK probe
        if: matrix.current
        working-directory: verification/sdkprobe
        run: go test -race -count=1 -timeout 120s ./...
      - name: Integrated Chromium smoke against real Hub
        if: runner.os == 'Linux' && matrix.current
        run: |
          go build -trimpath -o dist/mcp-hub ./cmd/mcp-hub
          node internal/admin/browsertest/live-smoke.mjs
      - name: Build
        run: go build -trimpath ./cmd/mcp-hub

  vulnerability-scan:
    name: Govulncheck / Go 1.27.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          go-version-input: '1.27.1'
          go-package: ./...
