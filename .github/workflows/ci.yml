name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - name: Admin UI tests
        if: runner.os == 'Linux'
        run: |
          node --check internal/admin/web/app.js
          node --test internal/admin/webtest/*.test.mjs
      - name: Install browser regression dependencies
        if: runner.os == 'Linux'
        working-directory: internal/admin/browsertest
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Chromium UI regressions (stubbed API)
        if: runner.os == 'Linux'
        working-directory: internal/admin/browsertest
        run: npm test
      - name: Test
        run: go test -count=1 -timeout 180s ./...
      - name: Race test
        run: go test -race -count=1 -timeout 180s ./...
      - name: Vet
        run: go vet ./...
      - name: SDK probe
        working-directory: verification/sdkprobe
        run: go test -race -count=1 -timeout 90s ./...
      - name: Integrated Chromium smoke (real Hub)
        if: runner.os == 'Linux'
        run: |
          go build -trimpath -o dist/mcp-hub ./cmd/mcp-hub
          node internal/admin/browsertest/live-smoke.mjs
      - name: Build
        run: go build -trimpath -ldflags="-s -w" ./cmd/mcp-hub
