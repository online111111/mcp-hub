name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Test
        run: go test -count=1 -timeout 180s ./...
      - name: Race test
        run: go test -race -count=1 -timeout 180s ./...
      - name: Vet
        run: go vet ./...
      - name: SDK probe
        working-directory: verification/sdkprobe
        run: go test -race -count=1 -timeout 90s ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w" ./cmd/mcp-hub
